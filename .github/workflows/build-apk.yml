name: Build Lulu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/lulu/kids
          mkdir -p app/src/main/res/values

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/lulu/kids/MainActivity.kt
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          if [ ! -f app/build.gradle.kts ]; then
            cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lulu.kids"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.lulu.kids"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.compose.ui:ui:1.7.8")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.8")
              implementation("androidx.compose.material3:material3:1.3.1")
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lulu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
